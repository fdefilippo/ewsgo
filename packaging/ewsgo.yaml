# Set the Zimbra origin and TLS paths before starting ewsgo.service.
# These settings enable EWS. See docs/zimbra.md for classic Outlook options.
listen: "127.0.0.1:8443"
loglevel: info
store-path: /var/lib/ewsgo/ewsgo.db
# zimbra-origin: https://mail.example.org
# tls-cert: /etc/ewsgo/fullchain.pem
# tls-key: /etc/ewsgo/key.pem
